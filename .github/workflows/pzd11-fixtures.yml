name: PZD-11 fixtures

on:
  pull_request:
    paths:
      - "docs/contracts/gameplay/v1/**"
      - "docs/contracts/gameplay/v2/**"
      - ".github/workflows/pzd11-fixtures.yml"

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/contracts/gameplay/v1/reference_check.py
      - run: node docs/contracts/gameplay/v1/validate.mjs
      - name: SHA-256 checksums v1
        working-directory: docs/contracts/gameplay/v1
        run: sha256sum -c CHECKSUMS.txt
      - run: python3 docs/contracts/gameplay/v2/reference_check.py
      - run: node docs/contracts/gameplay/v2/validate.mjs
      - name: SHA-256 checksums v2
        working-directory: docs/contracts/gameplay/v2
        run: sha256sum -c CHECKSUMS.txt
