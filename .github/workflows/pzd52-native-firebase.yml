name: PZD-52 Native Firebase and release verification

on:
  pull_request:
    branches: ["version/**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/pzd52-native-firebase.yml"
      - ".github/workflows/android-firebase-staging.yml"
  push:
    branches: ["version/**"]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/pzd52-native-firebase.yml"
      - ".github/workflows/android-firebase-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pzd52-native-firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Resolve and commit the Flutter 3.50.0 lockfile
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get
          if git -C ../.. diff --quiet -- apps/mobile/pubspec.lock; then
            echo "pubspec.lock is already current"
          else
            git -C ../.. config user.name "github-actions[bot]"
            git -C ../.. config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C ../.. add apps/mobile/pubspec.lock
            git -C ../.. commit -m "[PZD-49] Resolve pubspec.lock with Flutter 3.50.0"
            git -C ../.. push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  flutter-quality:
    needs: refresh-lockfile
    if: always() && (needs.refresh-lockfile.result == 'success' || needs.refresh-lockfile.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - working-directory: apps/mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  android-staging:
    needs: flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build staging APK and verify Firebase resources
        working-directory: apps/mobile
        env:
          ORG_GRADLE_PROJECT_pzdStagingFirebase: "true"
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build apk --release \
            --dart-define=PZD_FIREBASE_CONFIGURED=true \
            --dart-define=PZD_DIAGNOSTIC_ENV=staging \
            --dart-define=PZD_STAGING_DIAGNOSTICS=true
          RESOURCE=build/app/generated/res/google-services/release/values/values.xml
          test -s "$RESOURCE"
          grep -q 'puzzle-duel-staging' "$RESOURCE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pzd-0.0.1-android-staging
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  android-production:
    needs: flutter-quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build production APK without staging Firebase
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build apk --release
          RESOURCE=build/app/generated/res/google-services/release/values/values.xml
          test ! -e "$RESOURCE"

  ios-staging:
    needs: flutter-quality
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build iOS staging app and inspect Firebase plist
        working-directory: apps/mobile
        env:
          PZD_STAGING_FIREBASE: "1"
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign \
            --dart-define=PZD_FIREBASE_CONFIGURED=true \
            --dart-define=PZD_DIAGNOSTIC_ENV=staging \
            --dart-define=PZD_STAGING_DIAGNOSTICS=true
          APP=build/ios/iphoneos/Runner.app
          test -s "$APP/GoogleService-Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$APP/GoogleService-Info.plist" | grep -qx puzzle-duel-staging
          /usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' "$APP/GoogleService-Info.plist" | grep -qx app.puzzleduel.puzzleDuelMobile

  ios-production:
    needs: flutter-quality
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Build production iOS app without staging Firebase
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign
          test ! -e build/ios/iphoneos/Runner.app/GoogleService-Info.plist
