<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PZD-42 visual review</title>
  <style>
    body { margin: 24px; background: #10141c; color: #f2f6ff; font: 16px/1.4 system-ui, sans-serif; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { max-width: 820px; color: #a8b6d4; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    figure { margin: 0; background: #182033; border-radius: 12px; padding: 10px; }
    img { width: 100%; height: auto; border-radius: 8px; background: #070b14; }
    figcaption { margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>PZD-42 visual review</h1>
  <p>Rendered at 390×844 from widget goldens on macOS. These are test fixtures, not a physical iPhone capture. The app does not invent ranked players.</p>
  <div class="grid">
    <figure><img src="01-home-ready.png" alt="Home, tournament available"><figcaption>1. Home — tournament available</figcaption></figure>
    <figure><img src="02-home-progress.png" alt="Home, tournament in progress"><figcaption>2. Home — tournament in progress</figcaption></figure>
    <figure><img src="03-home-complete.png" alt="Home, tournament completed"><figcaption>3. Home — tournament completed</figcaption></figure>
    <figure><img src="04-settings.png" alt="Settings"><figcaption>4. Settings</figcaption></figure>
    <figure><img src="05-leaderboard-one.png" alt="Weekly leaderboard with one player"><figcaption>5. Leaderboard Weekly / All, one verified player</figcaption></figure>
    <figure><img src="06-leaderboard-many.png" alt="Weekly leaderboard with several players"><figcaption>6. Leaderboard with fixture players</figcaption></figure>
    <figure><img src="07-leaderboard-empty.png" alt="Empty leaderboard"><figcaption>7. Leaderboard empty</figcaption></figure>
    <figure><img src="08-leaderboard-daily.png" alt="Daily leaderboard"><figcaption>8. Leaderboard Daily</figcaption></figure>
    <figure><img src="09-practice-result.png" alt="Practice result"><figcaption>9. Practice result</figcaption></figure>
    <figure><img src="10-tournament-results.png" alt="Tournament final result"><figcaption>10. Tournament final result</figcaption></figure>
  </div>
</body>
</html>
