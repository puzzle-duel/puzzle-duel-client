name: puzzle_duel_mobile
description: "Puzzle Duel iOS/Android client bootstrap (PZD-22)"
publish_to: "none"
version: 0.0.1+1

# Pinned to Accepted ADR-001: Flutter 3.50.0 / Dart 3.14.0.
environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0 <3.51.0"

dependencies:
  audioplayers: 6.5.1
  firebase_core: ^4.3.0
  firebase_crashlytics: ^5.0.6
  flame: 1.38.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^6.2.2
  material_ui: ^1.11.0
  path_provider: 2.1.5
  puzzle_duel_rules:
    path: ../../packages/puzzle_duel_rules
  sign_in_with_apple: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/place.wav
    - assets/sfx/reject.wav
    - assets/sfx/clear.wav
    - assets/sfx/cascade.wav
    - assets/sfx/chain_complete.wav
    - assets/sfx/round_end.wav
    - assets/branding/app_icon_master_1024.png

